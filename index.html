         hover:bg-[#607D9B]
         hover:ring-2 hover:ring-[#91AAC5]
         transition-all duration-300 ease-in-out
         rounded-lg px-4 py-3">
                    Adicionar
                </button>

            </form>

            <!-- Pesquisa -->

                    class="px-4 py-3 rounded-full bg-[#323B46] text-[#E8EDF3] hover:bg-[#414D5B] whitespace-nowrap shrink-0 transition-colors">
